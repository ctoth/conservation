name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.85.0"
            python: "3.10"
          - os: ubuntu-latest
            rust: stable
            python: "3.13"
          - os: windows-latest
            rust: stable
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.8"
      - name: Build isolated native package
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Rust compatibility and contracts
        run: |
          uv run --no-sync cargo test --workspace --locked
      - name: Bridgman stays in conservation-bridgman
        run: |
          for crate in conservation-core conservation-dynamics conservation-exchange \
              conservation-linear conservation-python conservation-stock-flow \
              conservation-test-kinds conservation-trace; do
            if uv run --no-sync cargo tree -p "$crate" --locked -e normal,build,dev | grep -q bridgman; then
              echo "$crate depends on Bridgman"
              exit 1
            fi
          done
      # MSRV proves build/runtime compatibility. Stable owns the lint policy;
      # historical Clippy versions diagnose unchanged code differently.
      - name: Rust formatting and lint
        if: matrix.rust == 'stable'
        run: |
          uv run --no-sync cargo fmt --all -- --check
          uv run --no-sync cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Python contracts and typing
        run: |
          uv run --no-sync python -c "import conservation_exchange; print(conservation_exchange.__version__)"
          uv run --no-sync pytest python/tests -q
          uv run --no-sync pyright
      - name: Build and test installed wheel
        run: |
          uv run --no-sync maturin build --locked --out target/contract-wheels
          wheels=(target/contract-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --reinstall --no-deps "${wheels[0]}"
          uv run --no-sync pytest python/tests -q
      - name: Lockfiles remain unchanged
        run: git diff --exit-code -- Cargo.lock uv.lock
