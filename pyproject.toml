[project]
name = "conservation-exchange"
version = "0.2.0"
description = "Exact coupled exchanges with atomic quantity and participant publication"
readme = "conservation-exchange/README.md"
license = "MIT"
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[dependency-groups]
dev = ["maturin>=1.10,<2", "pytest>=8", "pyright>=1.1"]

[tool.maturin]
manifest-path = "conservation-python/Cargo.toml"
python-source = "python"
module-name = "conservation_exchange._native"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.pyright]
include = ["python"]
typeCheckingMode = "strict"
